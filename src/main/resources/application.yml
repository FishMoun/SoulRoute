spring:
  application:
    name: SoulRoute
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/soulroute}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-2ad107f74e584e57aa2253c25c0867bc}
      chat:
        options:
          model: qwen-plus
    mcp:
      server:
        name: stdio-mcp-server
        version: 1.0.0
        stdio: true
        type: SYNC # 同步
      client:
        stdio:
          servers-configuration: classpath:mcp-servers.json

server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.fishmoun.soulroute.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

search-api:
  api-key: ef2LQ2keTvP83ZGQwiKemghX

soulroute:
  rag:
    documents-location: classpath*:com/fishmoun/soulroute/data/**/*.docx
    index-on-startup: true
    chunk-size: 800
    chunk-overlap-chars: 120
    min-chunk-size-chars: 120
    min-chunk-length-to-embed: 20
    max-num-chunks: 10000
    top-k: 5
    similarity-threshold: 0.65
    hybrid:
      vector-top-k: 12
      metadata-top-k: 12
      vector-weight: 0.7
      metadata-weight: 0.3
    vector:
      schema-name: public
      table-name: travel_document_chunks
      dimensions: 1536
      initialize-schema: true
      remove-existing-table: false
      validate-table: false
      index-type: HNSW
